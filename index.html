<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111d"><title>Rick's Trackers</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#07101b;--panel:#101b2a;--line:#26364b;--text:#f7f9fc;--muted:#93a4ba;--green:#25c77b;--red:#ff5063;--amber:#f4b544;--blue:#4d9cff}
*{box-sizing:border-box}body{margin:0;background:#07101b;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:720px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:26px;font-weight:900}.small{font-size:12px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}.head{display:flex;justify-content:space-between;gap:12px}.asset{font-size:23px;font-weight:900}
.pill{padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900}.secure{background:#143725;color:#8df0b8}.alarm{background:#4a1d25;color:#ffb1bb}.off{background:#3a2d17;color:#ffd789}
.modegrid,.geos,.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.actions{grid-template-columns:1fr 1fr}
button{border:1px solid #31445f;background:#162338;color:#e7eef8;border-radius:14px;padding:13px 7px;font-weight:900}.mode.active{outline:2px solid var(--blue)}.test{grid-column:1/-1;background:#1f5f91}
#map{height:300px;border-radius:17px;overflow:hidden;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.stat{background:#0b1522;border:1px solid var(--line);border-radius:14px;padding:11px}.label{font-size:10px;color:var(--muted);text-transform:uppercase}.value{font-size:17px;font-weight:900;margin-top:5px}.full{grid-column:1/-1}
.banner{display:none;margin-top:12px;padding:12px;border-radius:13px;font-weight:800}.banner.show{display:block}.green{background:#153827}.red{background:#481d25}.amber{background:#3a2d17}
.event{padding:9px 0;border-bottom:1px solid #1f2e42}.et{font-weight:850;font-size:13px}.ed{font-size:12px;color:var(--muted);margin-top:2px}
</style></head><body><div class="app">
<div class="top"><div><div class="brand">Rick's Trackers</div><div class="small">Car Trailer</div></div><div class="small" id="conn">Connecting…</div></div>
<div class="card"><div class="head"><div><div class="asset">Car Trailer</div><div class="small" id="sub">Waiting for tracker data</div></div><div class="pill off" id="pill">WAITING</div></div>
<div class="modegrid"><button class="mode" id="marmed" onclick="mode('armed')">ARMED</button><button class="mode" id="mgeofence" onclick="mode('geofence')">GEOFENCE</button><button class="mode" id="moff" onclick="mode('off')">TRAVEL / OFF</button></div>
<div class="banner" id="banner"></div><div id="map"></div>
<div class="grid">
<div class="stat"><div class="label">Last update</div><div class="value" id="last">—</div></div><div class="stat"><div class="label">Speed</div><div class="value" id="speed">—</div></div>
<div class="stat"><div class="label">Battery</div><div class="value" id="battery">—</div></div><div class="stat"><div class="label">External power</div><div class="value" id="power">—</div></div>
<div class="stat"><div class="label">LTE</div><div class="value" id="lte">—</div></div><div class="stat"><div class="label">GPS</div><div class="value" id="gps">—</div></div>
<div class="stat"><div class="label">Telegram alerts</div><div class="value" id="sms">—</div></div><div class="stat"><div class="label">Last alert</div><div class="value" id="lastsms">—</div></div>
<div class="stat full"><div class="label">Current mode</div><div class="value" id="mode">—</div></div></div></div>
<div class="card"><b>Geofence radius</b><div class="geos"><button id="g100" onclick="geo(100)">100 ft</button><button id="g500" onclick="geo(500)">500 ft</button><button id="g1000" onclick="geo(1000)">1000 ft</button></div></div>
<div class="card"><b>Tracking & alerts</b><div class="actions"><button onclick="live(true)">LIVE TRACK</button><button onclick="live(false)">NORMAL UPDATES</button><button onclick="setHome()">SET HOME HERE</button><button onclick="clearAlarm()">CLEAR ALARM</button><button type="button" class="test" id="testSmsBtn">TEST TELEGRAM ALERT</button></div></div>
<div class="card"><b>Recent events</b><div id="events" class="small" style="margin-top:8px">No events yet.</div></div>
</div><script>
const $=id=>document.getElementById(id);let map=L.map('map').setView([36.85,-76.1],10),marker=L.marker([36.85,-76.1]).addTo(map),fence=L.circle([36.85,-76.1],{radius:304.8,weight:2,fillOpacity:.1}).addTo(map),route=L.polyline([],{weight:4}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
function age(x){if(!x)return'—';let s=Math.max(0,(Date.now()-new Date(x))/1000);return s<60?Math.floor(s)+' sec ago':s<3600?Math.floor(s/60)+' min ago':s<86400?Math.floor(s/3600)+' hr ago':Math.floor(s/86400)+' day ago'}
function label(m){return m==='armed'?'ARMED':m==='geofence'?'GEOFENCE ONLY':'TRAVEL / OFF'}
function msg(t,c='green'){let b=$('banner');b.textContent=t;b.className='banner show '+c;setTimeout(()=>b.className='banner',4500)}
async function api(p,o={}){let r=await fetch(p,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});if(!r.ok)throw Error((await r.text())||r.status);return r.json()}
function render(s){$('conn').textContent='Connected';$('last').textContent=age(s.last_seen);$('speed').textContent=(s.speed_mph??0)+' mph';$('battery').textContent=s.battery_percent==null?'—':s.battery_percent+'%';$('power').textContent=s.external_power==null?'—':s.external_power?'Connected':'Battery only';$('lte').textContent=s.lte||'—';$('gps').textContent=s.gps_fix===false?'No fix':s.gps_fix===true?'Locked':'—';$('sms').textContent=s.telegram_configured?'READY':'PRESS START';$('lastsms').textContent=age(s.last_alert_at);$('mode').textContent=label(s.mode);$('sub').textContent=s.alarm?(s.alarm_reason||'Alarm active'):'Monitoring normally';
['armed','geofence','off'].forEach(x=>$('m'+x).classList.toggle('active',s.mode===x));[100,500,1000].forEach(x=>$('g'+x).classList.toggle('active',Number(s.geofence_ft)===x));
let p=$('pill');p.textContent=s.alarm?'ALARM':s.mode==='off'?'OFF':'SECURE';p.className='pill '+(s.alarm?'alarm':s.mode==='off'?'off':'secure');
if(typeof s.lat==='number'){marker.setLatLng([s.lat,s.lon]);let a=typeof s.home_lat==='number'?s.home_lat:s.lat,b=typeof s.home_lon==='number'?s.home_lon:s.lon;fence.setLatLng([a,b]).setRadius((s.geofence_ft||1000)*.3048);route.setLatLngs((s.route||[]).map(x=>[x.lat,x.lon]));map.setView([s.lat,s.lon],16)}
$('events').innerHTML=(s.events||[]).slice(0,8).map(e=>'<div class="event"><div class="et">'+esc(e.title)+'</div><div class="ed">'+esc(e.detail||'')+' • '+age(e.time)+'</div></div>').join('')||'No events yet.'}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){try{render(await api('/api/trailer/status'))}catch(e){$('conn').textContent='Offline';$('sub').textContent=e.message}}
async function mode(x){try{render(await api('/api/trailer/mode',{method:'POST',body:JSON.stringify({mode:x})}));msg('Mode changed to '+label(x))}catch(e){msg(e.message,'red')}}
async function geo(x){try{render(await api('/api/trailer/geofence',{method:'POST',body:JSON.stringify({feet:x})}));msg('Geofence set to '+x+' ft')}catch(e){msg(e.message,'red')}}
async function live(x){try{render(await api('/api/trailer/live',{method:'POST',body:JSON.stringify({enabled:x})}));msg(x?'Live tracking requested':'Normal updates restored')}catch(e){msg(e.message,'red')}}
async function setHome(){try{render(await api('/api/trailer/set-home',{method:'POST',body:'{}'}));msg('Home position set to the current tracker location')}catch(e){msg(e.message,'red')}}
async function clearAlarm(){try{render(await api('/api/trailer/clear-alarm',{method:'POST',body:'{}'}));msg('Alarm cleared')}catch(e){msg(e.message,'red')}}
async function testSms(){
  const b=$('testSmsBtn');
  if(!b)return;
  b.disabled=true;
  const old=b.textContent;
  b.textContent='SENDING…';
  msg('Sending Telegram test…','amber');
  try{
    await api('/api/trailer/test-alert',{method:'POST',body:'{}'});
    b.textContent='ALERT SENT ✓';
    msg('Telegram alert sent. Check your phone.','green');
    setTimeout(refresh,500);
  }catch(e){
    b.textContent='FAILED — TAP AGAIN';
    msg('Telegram test failed: '+e.message,'red');
  }finally{
    setTimeout(()=>{b.disabled=false;b.textContent=old},3000);
  }
}
const testButton=$('testSmsBtn');
if(testButton)testButton.addEventListener('click',testSms);
refresh();setInterval(refresh,10000);
</script></body></html>
